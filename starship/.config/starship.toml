"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os$username$hostname \
$directory \
$git_branch$git_status \
$line_break$character\
"""
palette = "catppuccin_mocha"

[character]
success_symbol = "[󰞇](green)"
error_symbol = "[󰞇](red)"
vimcmd_symbol = "[󰞇](green)"

[os]
disabled = false
style = "bg:blue fg:base"
format = '[](fg:blue)[$symbol]($style)'

[os.symbols]
Macos = " "

[username]
show_always = true
style_user = "bg:blue fg:base"
style_root = "bg:sky fg:base"
format = '[$user]($style)'

[hostname]
ssh_only = false
style = "bg:blue fg:base"
format = '[@$hostname]($style)[](fg:blue)'

[directory]
style = "fg:base bg:pink"
format = "[](fg:pink)[ $path]($style)[](fg:pink)"
truncation_length = 2
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:green fg:base"
format = '[](fg:green)[$symbol $branch]($style)'

[git_status]
style = "bg:green fg:base"
format = '[ $all_status$ahead_behind]($style)[](fg:green)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
